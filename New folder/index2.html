<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Shadow</title>
</head>
<style>
    body {
        
       font-family: sans-serif; 

    }
    div {
        height: 200px;
        background:linear-gradient(to bottom right,#ff9a9e, #421509 );
        border: 10px;
        text-align: center;
        border-radius: 20px;
        color: rgb(51, 51, 51);
        text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.2);
        letter-spacing: -2px;
        box-shadow: 0px 8px 10px rgba(0, 0, 0, 0.1);
    }
    button {
    text-transform: capitalize;
    }
    p {
        background: linear-gradient(to right,pink,purple);
        -webkit-background-clip: text;
        color: transparent;
        line-height: 1.6;
        letter-spacing: 1px;
        text-shadow: 1px 1px 3px rgb(0, 0, 0, 0.2);
    }
    h2 {
        background: radial-gradient(white, blue);
    }
    img {
        width: 200px;
        border: 2px solid rgb(108, 108, 108);
        border-radius: 10px;
        filter: brightness(80%);
        object-fit: cover;
    }
</style>
<body>
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRF8kS5qUwYMurMR_KKjX8UuVTR9yMDzls0_A&s" alt="">
    <div>
        <h1>Gradient</h1>
    </div>
    <h2>Welcome to CodingWise</h2>
    <p>This is CSS<br>This is HTML</p>
    <button type="button">Contact us</button>
</body>
</html>
