<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid+FlexBox</title>
    <style>
        body {
            background: #f5f5f7;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            padding: 40px;
        }
      .product-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 25px;
      }
      .card {
        background: white;
        padding: 20px;
        border: 1px solid#ddd;
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px;
      }

      .card img {
        object-fit: contain;
      }
      .price {
        font-size: 20px;
        font-weight: bold;
      }
      .btn-row {
        display: flex;
        gap: 10px;
      }
      .btn-blue,.btn-black {
        pad: 8px 18px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        color: white;
      }
      .btn-blue {
        background: blue;
      }
      .btn-black {
      background: black;
      }
      
    </style>
</head>
